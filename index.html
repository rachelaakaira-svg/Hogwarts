<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwarts Teacher Form</title>
</head>
<body>
    <h1>
        Hogwarts Teacher Form
    </h1>
    <form>
        <label for="fname">
            First Name: 
        </label>
        <input type="text" id="fname" name="fname">
        <br>
        <br>
        <label for="lname">
            Last Name: 
        </label>
        <input type="text" id="lname" name="lname">
        <br>
        <br>
        <label for="Haaland">
            Age: 
        </label>
        <input type="number" min="25" id="Haaland" name="Haaland"> 
        <br>
        <br>
        <label for="SUZY">
            Gender 
        </label>
        <br>
        <input type="radio" id="ME" name="SUZY">
        <label for="ME">
            Female
        </label>
        <br>
        <input type="radio" id="IU" name="SUZY">
        <label for="IU">
            Male
        </label>
        <br>
        <br>
        <label for="Subject">
         Subject
        </label>
        <br>
        <input type="checkbox" id="Apple" name="Subject">
        <label for="Apple">
            Transfiguration
        </label>
         <br>
        <input type="checkbox" id="Oranges" name="Subject">
        <label for="Oranges">
            Charms
        </label>
        <br>
        <input type="checkbox" id="Jennie" name="Subject">
        <label for="Jennie">
            Potions
        </label>
         <br>
        <input type="checkbox" id="ilovevscode" name="Subject">
        <label for="ilovevscode">
            History of Magic
        </label>
         <br>
        <input type="checkbox" id="i" name="Subject">
        <label for="i">
           Defence Against the Dark Arts
        </label> <br>
        <input type="checkbox" id="dont" name="Subject">
        <label for="dont">
            Astronomy
        </label> <br>
        <input type="checkbox" id="know" name="Subject">
        <label for="know">
            Herbology
        </label>
    </form>
</body>
</html>
